<aside class="sidebar-wrapper">
  <!-- Top Brand Section (Prominent Branding) -->
  <div class="brand-top">
    <div class="brand-info">
      <div class="title-row">
        <span class="brand-name">Zero Pixel</span>
        <span class="brand-badge">ERP</span>
      </div>
      <span class="brand-tagline">Global Perspective, Local Expertise</span>
    </div>
  </div>

  <!-- Navigation Tree -->
  <div class="nav-container">
    <div class="nav-section-title">NAVIGATION</div>

    <nav class="nav-tree">
      <!-- 1. Dashboard -->
      <a 
        routerLink="/admin/dashboard" 
        routerLinkActive="active" 
        class="nav-item-link"
        title="Dashboard"
      >
        <span class="item-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1"/>
            <rect width="7" height="5" x="14" y="3" rx="1"/>
            <rect width="7" height="9" x="14" y="12" rx="1"/>
            <rect width="7" height="5" x="3" y="16" rx="1"/>
          </svg>
        </span>
        <span class="item-label">Dashboard</span>
      </a>

      <!-- 2. Sales (Dropdown Group) -->
      <div class="nav-group" [class.group-active]="isSalesRouteActive()">
        <button 
          type="button" 
          class="nav-group-header" 
          [class.expanded]="salesExpanded()"
          (click)="toggleSales()"
          title="Toggle Sales Menu"
        >
          <span class="item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </span>
          <span class="item-label">Sales</span>
          <span class="dropdown-chevron" [class.rotated]="salesExpanded()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>

        <!-- Sales Dropdown Submenu -->
        <div class="nav-submenu" *ngIf="salesExpanded()">
          <a 
            routerLink="/admin/customers" 
            routerLinkActive="sub-active" 
            class="submenu-link"
            title="Customers"
          >
            <span class="submenu-bullet"></span>
            <span class="submenu-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </span>
            <span class="submenu-label">Customers</span>
          </a>

          <!-- Smart Quotations -->
          <a 
            routerLink="/admin/quotations" 
            routerLinkActive="sub-active" 
            class="submenu-link"
            title="Smart Quotations"
          >
            <span class="submenu-bullet"></span>
            <span class="submenu-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
            </span>
            <span class="submenu-label">Smart Quotations</span>
          </a>
        </div>
      </div>

      <!-- 3. Production (Dropdown Group) -->
      <div class="nav-group" [class.group-active]="isProductionRouteActive()">
        <button 
          type="button" 
          class="nav-group-header" 
          [class.expanded]="productionExpanded()"
          (click)="toggleProduction()"
          title="Toggle Production Menu"
        >
          <span class="item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
          </span>
          <span class="item-label">Production</span>
          <span class="dropdown-chevron" [class.rotated]="productionExpanded()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>

        <!-- Production Dropdown Submenu -->
        <div class="nav-submenu" *ngIf="productionExpanded()">
          <a 
            routerLink="/admin/production/in-house" 
            routerLinkActive="sub-active" 
            class="submenu-link"
            title="In-House Production"
          >
            <span class="submenu-bullet"></span>
            <span class="submenu-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"/>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                <rect x="6" y="14" width="12" height="8"/>
              </svg>
            </span>
            <span class="submenu-label">In-House Production</span>
          </a>

          <a 
            routerLink="/admin/production/outsourced" 
            routerLinkActive="sub-active" 
            class="submenu-link"
            title="Outsourced Production"
          >
            <span class="submenu-bullet"></span>
            <span class="submenu-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="3" width="15" height="13"/>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
                <circle cx="5.5" cy="18.5" r="2.5"/>
                <circle cx="18.5" cy="18.5" r="2.5"/>
              </svg>
            </span>
            <span class="submenu-label">Outsourced Production</span>
          </a>
        </div>
      </div>

      <!-- 4. Printing Intelligence (Dropdown Group) -->
      <div class="nav-group" [class.group-active]="isIntelligenceRouteActive()">
        <button 
          type="button" 
          class="nav-group-header" 
          [class.expanded]="intelligenceExpanded()"
          (click)="toggleIntelligence()"
          title="Toggle Printing Intelligence Menu"
        >
          <span class="item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4"/>
              <path d="m4.93 4.93 2.83 2.83"/>
              <path d="M2 12h4"/>
              <path d="m4.93 19.07 2.83-2.83"/>
              <path d="M12 22v-4"/>
              <path d="m19.07 19.07-2.83-2.83"/>
              <path d="M22 12h-4"/>
              <path d="m19.07 4.93-2.83 2.83"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
          <span class="item-label">Printing Intelligence</span>
          <span class="dropdown-chevron" [class.rotated]="intelligenceExpanded()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>

        <!-- Printing Intelligence Dropdown Submenu -->
        <div class="nav-submenu" *ngIf="intelligenceExpanded()">
          <a 
            routerLink="/admin/printing-intelligence/sheet-calculator" 
            routerLinkActive="sub-active" 
            class="submenu-link"
            title="Sheet Calculator"
          >
            <span class="submenu-bullet"></span>
            <span class="submenu-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2"/>
                <line x1="8" y1="6" x2="16" y2="6"/>
                <path d="M16 10h.01"/>
                <path d="M12 10h.01"/>
                <path d="M8 10h.01"/>
                <path d="M12 14h.01"/>
                <path d="M8 14h.01"/>
                <path d="M12 18h.01"/>
                <path d="M8 18h.01"/>
              </svg>
            </span>
            <span class="submenu-label">Sheet Calculator</span>
          </a>
        </div>
      </div>
    </nav>
  </div>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <div class="footer-status">
      <span class="status-indicator"></span>
      <span class="status-text">System Active</span>
    </div>
    <span class="version-tag">v1.0.0</span>
  </div>
</aside>
