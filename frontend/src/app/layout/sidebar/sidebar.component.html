<aside class="sidebar-wrapper">
  <!-- Top Brand Section (Prominent Branding) -->
  <div class="brand-top">
    <div class="brand-info">
      <div class="title-row">
        <span class="brand-name">Zero Pixel</span>
        <span class="brand-badge">ERP</span>
      </div>
      <span class="brand-tagline">Global Perspective, Local Expertise</span>
    </div>
  </div>

  <!-- Navigation Tree -->
  <div class="nav-container">
    <div class="nav-section-title">NAVIGATION</div>

    <nav class="nav-tree">
      <!-- 1. Dashboard -->
      <a 
        routerLink="/admin/dashboard" 
        routerLinkActive="active" 
        class="nav-item-link"
        title="Dashboard"
      >
        <span class="item-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1"/>
            <rect width="7" height="5" x="14" y="3" rx="1"/>
            <rect width="7" height="9" x="14" y="12" rx="1"/>
            <rect width="7" height="5" x="3" y="16" rx="1"/>
          </svg>
        </span>
        <span class="item-label">Dashboard</span>
      </a>

      <!-- 2. Sales (Dropdown Group) -->
      <div class="nav-group" [class.group-active]="isSalesRouteActive()">
        <button 
          type="button" 
          class="nav-group-header" 
          [class.expanded]="salesExpanded()"
          (click)="toggleSales()"
          title="Toggle Sales Menu"
        >
          <span class="item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </span>
          <span class="item-label">Sales</span>
          <span class="dropdown-chevron" [class.rotated]="salesExpanded()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </button>

        <!-- Sales Dropdown Submenu -->
        <div class="nav-submenu" *ngIf="salesExpanded()">
          <a 
            routerLink="/admin/customers" 
            routerLinkActive="sub-active" 
            class="submenu-link"
            title="Customers"
          >
            <span class="submenu-bullet"></span>
            <span class="submenu-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </span>
            <span class="submenu-label">Customers</span>
          </a>

          <!-- Smart Quotations (Added under Customers) -->
          <a 
            routerLink="/admin/quotations" 
            routerLinkActive="sub-active" 
            class="submenu-link"
            title="Smart Quotations"
          >
            <span class="submenu-bullet"></span>
            <span class="submenu-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
            </span>
            <span class="submenu-label">Smart Quotations</span>
          </a>
        </div>
      </div>
    </nav>
  </div>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <div class="footer-status">
      <span class="status-indicator"></span>
      <span class="status-text">System Active</span>
    </div>
    <span class="version-tag">v1.0.0</span>
  </div>
</aside>
