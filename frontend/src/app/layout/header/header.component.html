<header class="admin-header">
  <div class="header-left">
    <div class="module-title-wrap">
      <span class="system-prefix">{{ authService.currentUser()?.fullName || 'Naveed Ahmad' }}</span>
      <span class="divider">/</span>
      <span class="active-module-pill">{{ currentModule }}</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Light / Dark Mode Toggle Icon -->
    <button 
      type="button" 
      class="btn-theme-toggle" 
      (click)="themeService.toggleTheme()" 
      [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      aria-label="Toggle Theme"
    >
      @if (themeService.isDarkMode()) {
        <!-- Sun icon shown in Dark Mode -->
        <svg class="theme-icon sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      } @else {
        <!-- Moon icon shown in Light Mode -->
        <svg class="theme-icon moon-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      }
    </button>

    <div class="admin-profile">
      <div class="avatar-circle">
        {{ authService.currentUser()?.fullName?.charAt(0) || 'N' }}
      </div>
      <div class="profile-details">
        <span class="admin-name">{{ authService.currentUser()?.fullName || 'Naveed Ahmad' }}</span>
        <span class="admin-role">{{ authService.currentUser()?.role || 'Admin' }}</span>
      </div>
    </div>

    <button type="button" class="btn-logout" (click)="onLogout()" title="Sign Out">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Sign Out</span>
    </button>
  </div>
</header>
